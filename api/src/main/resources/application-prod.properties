# =========================================================
# Production profile (activated by the Dockerfile ENTRYPOINT).
# All secrets come from the hosting platform's environment
# variables. NEVER hardcode credentials in this file.
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway applies new V*.sql migrations on startup. baseline-on-migrate only
# matters for a non-empty schema with no flyway_schema_history table.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Never allow flyway:clean against production (it drops every table).
spring.flyway.clean-disabled=true

# Flyway owns the schema; Hibernate must not touch or validate it.
# (Some JPA entities use Long ids where migrations use INT, which is fine at
# the JDBC level but fails strict validation.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.sql.init.mode=never

# Set to the deployed frontend origin(s), comma separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
