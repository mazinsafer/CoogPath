spring.application.name=coogpath

# Local secrets live in api/.env (gitignored). Any key below can also be set
# as an environment variable.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coogpath}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema (src/main/resources/db/migration). Hibernate must not
# create or alter tables, or local schemas drift away from production.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Sign-in tokens (HS256 JWT). JWT_SECRET must be 32+ characters and the same on
# every instance; when unset a random key is used and sign-ins end on restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=${JWT_TTL:7d}
app.jwt.issuer=coogpath

# Generated plans are cached. "caffeine" keeps them in this process; set
# CACHE_TYPE=redis and REDIS_URL to share them across instances and restarts.
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.cache-names=plans
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=1h
app.cache.plan-ttl=1h
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.repositories.enabled=false

# Requests per minute per client IP. trust-forwarded-for must only be true
# behind a proxy that sets X-Forwarded-For, or clients can spoof their IP.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_PROXY:false}
app.rate-limit.auth-per-minute=10
app.rate-limit.plan-per-minute=30
app.rate-limit.default-per-minute=300

# Roadmap advisor. Keep the key on the API server, never in Vite variables.
app.advisor.openai-api-key=${OPENAI_API_KEY:}
app.advisor.model=${ADVISOR_MODEL:gpt-4o-mini}
app.rate-limit.advisor-per-minute=${ADVISOR_RATE_LIMIT:10}
